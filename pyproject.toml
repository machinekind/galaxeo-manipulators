[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxeo"
version = "0.1.0"
description = "Galaxea A1X over CAN-FD: protocol encoders/decoder and CAN transports (SocketCAN, XCAN on macOS, python-can)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# XCAN / PCAN-USB FD dongle on macOS through the userspace driver (also: brew install libusb).
xcan = ["pyusb>=1.2"]
# python-can transports: PCAN-Basic on Windows, virtual:x loopback, any <interface>:<channel>.
pcan = ["python-can>=4"]
# galaxeo.arm: the installed arm (model, IK, collisions, reach box, guarded moves).
arm = ["numpy>=1.24", "mujoco>=3.2"]
# PyYAML: the tests read galaxeo/robot/a1x/robot.yaml (the twin reads it at run time).
test = ["pytest>=7", "PyYAML>=6"]

# The digital twin (lerobot_mp) finds the A1X through these; galaxeo never imports the twin.
[project.entry-points."lerobot_mp.robots"]
a1x = "galaxeo.robot:ROBOT_DIR"

[project.entry-points."lerobot_mp.backends"]
a1x = "galaxeo.robot.backend:create"

[tool.setuptools]
# Only the package; the rest of the repo (ROS 2 workspace, sim, scripts) is not installed.
packages = ["galaxeo", "galaxeo.arm", "galaxeo.robot"]

[tool.setuptools.package-data]
"galaxeo.arm" = ["assets/*.xml", "assets/*.json", "assets/meshes/*.STL"]
# The twin's robot folder; its model takes the meshes from galaxeo.arm.
"galaxeo.robot" = ["README.md", "a1x/robot.yaml", "a1x/a1x.xml", "a1x/demo.json", "a1x/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/*_test.py are hand-run end-to-end scripts (hardware, MuJoCo), not pytest cases.
python_files = ["test_*.py"]
pythonpath = ["."]
